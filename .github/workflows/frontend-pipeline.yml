name: Frontend CI
on:
  push:
    branches: [ master, pre-production, production ]
  pull_request:
    branches: [ master, pre-production, production ]

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: '20' }

        # TODO: CHECK THE MEANING OF THIS
        # We dont cache the ~/.npm ? ?
      - name: Cache node modules (dependencies)
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-node- # fallback mechanism to pick the closest match

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci #ci # npm install --ignore-scripts
        # ci don't just remove the node_modules folder and installs the dependencies again??
        # What's the point that we cache that.

      - name: Build frontend
        #        run: |
        #          cd frontend
        #          npm run build
        working-directory: frontend
        run: npm run build

      - name: List frontend directory (debug)
        run: ls -la frontend/

      - name: Rename .next to next-build (workaround for hidden dir)
        run: mv frontend/.next frontend/next-build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/next-build
          if-no-files-found: error

  test-frontend:
    name: Test Frontend
    needs: build-frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Cache node modules (dependencies)
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-node-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install #ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test -- --coverage --watchAll=false

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          path: frontend/coverage/
          name: frontend-coverage

  docker-build-push:
    name: Build and push Docker image
    needs: test-frontend
    runs-on: ubuntu-latest
    environment: Development
    #    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        #        uses: docker/build-push-action@v3
        run: |
          docker build --build-arg NEXT_PUBLIC_API_URL=${{ secrets.BACKEND_API_URL }} -t ${{ secrets.DOCKER_USERNAME }}/rirs-frontend:dev ./frontend
          docker tag ${{ secrets.DOCKER_USERNAME }}/rirs-frontend:dev ${{ secrets.DOCKER_USERNAME }}/rirs-frontend:${{ github.sha }}
      #          -t ${{ secrets.DOCKER_USERNAME }}/frontend-app:${{ github.ref_name }}

      - name: Push Docker image to DockerHub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/rirs-frontend:dev
          docker push ${{ secrets.DOCKER_USERNAME }}/rirs-frontend:${{ github.sha }}

  deploy-to-render:
    name: Deploy to Render
    needs: docker-build-push
    runs-on: ubuntu-latest
    environment: Development
    #    if: github.ref == 'refs/heads/master'

    steps:
      - name: Deploy to Render
        run: |
          curl -X POST ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
            
          
