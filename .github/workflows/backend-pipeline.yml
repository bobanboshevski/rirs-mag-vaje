name: Backend CI
on:
  push:
    branches: [ master, pre-production, production ]
  pull_request:
    branches: [ master, pre-production, production ]

  # waiting for the frontend pipeline to finish
  workflow_run:
    workflows: [ "Frontend CI" ]
    branches: [ master, production ]
    types: [ completed ]


jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Cache node modules (dependencies)
        uses: actions/cache@v4
        with:
          path: management-express-backend/node_modules
          key: ${{ runner.os }}-backend-node-${{ hashFiles('management-express-backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-node-
        # ⚠️ Caching:
        # - Če cache obstaja (cache hit), se node_modules obnovi, preden se zažene npm install.
        # - Če cache ne obstaja (cache miss), npm install ponovno ustvari mapo node_modules.
        # TODO: I NEED EXPLANATION FOR THIS


      - name: Install backend dependencies
        working-directory: management-express-backend
        run: npm install #ci

      #      - name: Build backend
      #        working-directory: management-express-backend
      #        run: npm run build

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          #          path: management-express-backend/build/
          # upload source code - we don't need to build because Node can run js files directly
          path: |
            management-express-backend/
            management-express-backend/node_modules/

  test-backend:
    name: Test Backend
    needs: build-backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Cache node modules (dependencies) # caching backend dependencies
        uses: actions/cache@v4
        with:
          path: management-express-backend/node_modules
          key: ${{ runner.os }}-backend-node-${{ hashFiles('management-express-backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-node-

      - name: Install backend dependencies
        working-directory: management-express-backend
        run: npm install
        # ⚠️ Cache hit:
        # - Če je cache hit, npm install preveri obstoječe odvisnosti in ne namešča ničesar dodatnega.
        # - Če je cache miss, npm install ponovno ustvari mapo node_modules.

      - name: Run backend tests
        working-directory: management-express-backend
        run: npm run test:coverage # -- --coverage

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: management-express-backend/coverage/

  docker-build-push-dev:
    name: Build and push Docker image to Development
    needs: test-backend
    runs-on: ubuntu-latest
    environment: Development
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx for caching
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image with Docker Buildx (caching)
        uses: docker/build-push-action@v3
        with:
          context: management-express-backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/rirs-backend:dev
            ${{ secrets.DOCKER_USERNAME }}/rirs-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/rirs-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/rirs-backend:buildcache,mode=max


  #      - name: Build Docker image
  #        run: |
  #          docker build -t ${{ secrets.DOCKER_USERNAME }}/rirs-backend:dev ./management-express-backend
  #          docker tag ${{ secrets.DOCKER_USERNAME }}/rirs-backend:dev \
  #          ${{ secrets.DOCKER_USERNAME }}/rirs-backend:${{ github.sha }}
  #
  #      - name: Push Docker image to DockerHub
  #        run: |
  #          docker push ${{ secrets.DOCKER_USERNAME }}/rirs-backend:dev
  #          docker push ${{ secrets.DOCKER_USERNAME }}/rirs-backend:${{ github.sha }}

  deploy-to-render:
    name: Deploy to Render Development
    needs: docker-build-push-dev
    runs-on: ubuntu-latest
    environment: Development
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Deploy to Render
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
  

  # todo: we should only add quality gate check to master branch for the backend
  # because we already have code analysis in the frontend pipeline for the whole project
  sonar-cloud-backend-tests-and-quality-gate: # the static code analysis is done in the frontend pipeline
    name: Backend - SonarCloud Quality Gate Check
    needs: test-backend
    runs-on: ubuntu-latest
    #    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/production'
    if: |
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/production') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

