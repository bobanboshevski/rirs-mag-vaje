  docker-build-push-prod:
    name: Build and push Docker image to Production
    needs: [ test-backend, sonar-cloud-backend-tests-and-quality-gate ] # TODO: add sonarqube later
    runs-on: ubuntu-latest
    environment:
      name: Production
    if: github.ref == 'refs/heads/production'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx for caching
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image with Docker Buildx (caching)
        uses: docker/build-push-action@v3
        with:
          context: management-express-backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/rirs-backend:prod
            ${{ secrets.DOCKER_USERNAME }}/rirs-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/rirs-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/rirs-backend:buildcache,mode=max

  deploy-to-render-prod:
    name: Deploy to Render Production
    needs: docker-build-push-prod
    runs-on: ubuntu-latest
    environment: Production
    if: github.ref == 'refs/heads/production'

    steps:
      - name: Deploy to Render Production
        run: |
          curl -X POST ${{ secrets.RENDER_PROD_DEPLOY_HOOK_URL }}

